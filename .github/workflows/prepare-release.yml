name: Prepare Release
on:
  workflow_dispatch:
    inputs:
      increment:
        description: 'Version increment (leave empty to auto-detect from conventional commits)'
        required: false
        type: choice
        options: ['', patch, minor, major]

concurrency:
  group: prepare-release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for existing open release PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OPEN_PR=$(gh pr list --state open --json number,headRefName,url \
            --jq '[.[] | select(.headRefName | startswith("release/"))][0]')

          if [ -n "$OPEN_PR" ] && [ "$OPEN_PR" != "null" ]; then
            echo "::error::An open release PR already exists. Merge or close it before preparing a new release."
            echo "$OPEN_PR"
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - run: npm ci

      - name: Check if worth releasing
        id: check
        run: |
          NEXT_VERSION=$(npx release-it ${{ inputs.increment }} --release-version --ci)
          if [ -z "$NEXT_VERSION" ]; then
            echo "No commits warranting a release were found since the last tag."
            echo "has_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Next version would be: $NEXT_VERSION"
            echo "has_release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump version and update changelog (no commit / no push)
        if: steps.check.outputs.has_release == 'true'
        run: npx release-it ${{ inputs.increment }} --ci

      - name: Read new version
        id: pkg
        if: steps.check.outputs.has_release == 'true'
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Commit and push release branch
        if: steps.check.outputs.has_release == 'true'
        run: |
          BRANCH="release/v${{ steps.pkg.outputs.version }}"
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add package.json CHANGELOG.md
          git commit -m "chore(release): v${{ steps.pkg.outputs.version }}"
          git push origin "$BRANCH" --force

      - name: Open release PR
        if: steps.check.outputs.has_release == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --base master \
            --head "release/v${{ steps.pkg.outputs.version }}" \
            --title "chore(release): v${{ steps.pkg.outputs.version }}" \
            --body "Automated release preparation PR, triggered by @${{ github.actor }}.

          Merging this PR will trigger tagging, GitHub Release creation, and npm publish." \
            --label release

      - name: No release needed
        if: steps.check.outputs.has_release == 'false'
        run: echo "::notice::Nothing to release — no qualifying commits (feat/fix/breaking) since the last tag."
